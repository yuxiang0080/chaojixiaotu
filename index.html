.refresh{text-align:center;color:var(--text-3);font-size:11px;padding:18px 0 4px}
.health-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 4px}
.health-stat{background:var(--card);border:.5px solid var(--sep);border-radius:14px;padding:12px}
.health-stat.wide{grid-column:1/-1}

'use strict';
/* ===== 工具 ===== */

const pad=n=>String(n).padStart(2,'0');
const roundQty=x=>{const n=Number(x);return isFinite(n)?Math.round(n*100)/100:0;};
const toDateStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const addMonths=(d,n)=>{const x=new Date(d),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x;};
const diffDays=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const vib=(ms=15)=>{if(navigator.vibrate) navigator.vibrate(ms);}; // 震动反馈

const parseDateStr=s=>{
  if(!s)return null;
  s=String(s).trim().replace(/[年月\/\.]/g,'-').replace(/日/g,'');
  const p=s.split('-').filter(x=>x!=='').map(Number);
  if(p.length<2||p.some(n=>isNaN(n))||p.length>3)return null;
  let y,m,d;
  if(p.length===2){y=new Date().getFullYear();m=p[0];d=p[1];}
  else{y=p[0];if(y<100)y+=2000;m=p[1];d=p[2];}
  if(m<1||m>12||d<1||d>31)return null;
  let dt=new Date(y,m-1,d);
  if(dt.getMonth()!==m-1||dt.getDate()!==d)return null;
  if(p.length===2&&diffDays(today(),dt)<-180){
    dt=new Date(y+1,m-1,d);
    if(dt.getMonth()!==m-1||dt.getDate()!==d)return null;
  }
  return dt;
};
const normDate=s=>{const d=parseDateStr(s);return d?toDateStr(d):'';};

色叶片(柠檬叶等)','饮品装饰物','r_leaf','盒','none',0],['金边奇兰茶底','鲜果汁及液体制品','r_ex5','包','months',12],['怡泉苏打水','鲜果汁及液体制品','r_same','瓶','months',9],['蓝柑糖浆','鲜果汁及液体制品','r_syrup29','瓶','months',12],['海盐焦糖风味糖浆','鲜果汁及液体制品','r_syrup29','瓶','months',30],['接骨木风味糖浆','鲜果汁及液体制品','r_syrup29','瓶','months',30],['巧克力酱','咖啡牛乳类','r_syrup29','瓶','months',12],['柠檬汁','鲜果汁及液体制品','r_same','瓶','none',0]];

/* ===== 数据校验与清洗 ===== */
const dedupe=arr=>{const seen=new Set();return arr.filter(x=>{if(!x||!x.id||seen.has(x.id))return false;seen.add(x.id);return true;});};
const clamp=(v,min,max,fb)=>{const n=Number(v);return isFinite(n)?Math.min(max,Math.max(min,n)):fb;};
const normalizeState=obj=>{
  const s=Object.assign(defaultState(),obj||{});
  s.categories=(Array.isArray(s.categories)?s.categories:[]).filter(c=>typeof c==='string'&&c.trim()).map(c=>c.trim());
  if(!s.categories.length)s.categories=DEFAULT_CATEGORIES.slice();

  s.settings={soonDays:Math.round(clamp(s.settings?.soonDays,1,30,DEFAULT_SETTINGS.soonDays)),lowStock:clamp(s.settings?.lowStock,0,1000,DEFAULT_SETTINGS.lowStock)};
  s.rules=dedupe((Array.isArray(s.rules)?s.rules:[]).filter(r=>r&&r.id!=null&&r.name!=null&&String(r.name).trim()&&(r.type==='days'||r.type==='months')).map(r=>{

    x.value=clamp(x.value,0,999,0);

  }));
  if(!s.rules.length)s.rules=JSON.parse(JSON.stringify(DEFAULT_RULES));
  s.materials=dedupe((Array.isArray(s.materials)?s.materials:[]).filter(m=>m&&m.id!=null&&m.name!=null&&String(m.name).trim()).map(m=>{
    const x=Object.assign({},m);
    x.id=String(x.id).trim();
    x.name=String(x.name).trim();
    x.alias = typeof x.alias === 'string' ? x.alias.trim() : '';
    x.categories=[...new Set((Array.isArray(x.categories)?x.categories:[]).filter(c=>typeof c==='string'&&c.trim()).map(c=>c.trim()))];
    if(!x.categories.length)x.categories=[UNCAT];
    x.ruleId=(x.ruleId==null?'':String(x.ruleId).trim());
    x.unit=(typeof x.unit==='string'&&x.unit.trim())?x.unit.trim():'瓶';
    x.unopenedType=(x.unopenedType==='days'||x.unopenedType==='months')?x.unopenedType:'none';
    x.unopenedValue=clamp(x.unopenedValue,0,999,0);
    x.disabled=!!x.disabled;
    x.isPrepared=!!x.isPrepared;
    x.pinned=!!x.pinned;

  }));

  s.materials.forEach(m=>m.categories.forEach(c=>{if(!s.categories.includes(c))s.categories.push(c);}));

/* ===== 查询与计算 ===== */
const getRule=id=>state.rules.find(r=>r.id===id)||null;
const getMat=id=>state.materials.find(m=>m.id===id)||null;
const getBatch=id=>state.batches.find(b=>b.id===id)||null;
const ruleOfBatch=(b,mat)=>{if(!mat)return null;const r=getRule(mat.ruleId);return r?{type:r.type,value:r.value}:null;};
const ruleTxt=r=>!r?'':(r.type==='months'?`+${r.value}月`:`D+${r.value}`);
const batchDueDate=(batch,mat)=>{
  if(!batch||!mat)return null;
  if(batch.expireDate){const d=parseDateStr(batch.expireDate);if(d)return d;}
  if(batch.status==='opened'){
    if(!batch.openDate)return null;
    const r=ruleOfBatch(batch,mat);if(!r)return null;
    const base=parseDateStr(batch.openDate);if(!base)return null;
    return r.type==='months'?addMonths(base,Number(r.value)||0):addDays(base,Number(r.value)||0);
  }
  if(batch.status==='unopened'){
    if(mat.unopenedType&&mat.unopenedType!=='none'&&mat.unopenedValue>0){
      const base=parseDateStr(batch.createDate);if(!base)return null;
      return mat.unopenedType==='months'?addMonths(base,mat.unopenedValue):addDays(base,mat.unopenedValue);
    }
  }
  return null;
};
const describeBatch=(b,m)=>({due:batchDueDate(b,m),ruleLabel:ruleTxt(ruleOfBatch(b,m))});
const pushLoss=(b,m,qty,note,extra)=>{
  const info=(b&&m)?describeBatch(b,m):{due:null,ruleLabel:''};
  const loss=Object.assign({
    id:uid('l'),batchId:b?b.id:'',materialId:m?m.id:'',materialName:m?m.name:'',unit:m?m.unit:'',
    qty:roundQty(qty),openDate:b?b.openDate||'':'',dueDate:info.due?toDateStr(info.due):'',ruleTxt:info.ruleLabel,
    date:todayStr(),note:note||'',createdAt:Date.now(),prevStatus:b?b.status:'',prevQty:b?roundQty(b.qty):0,fullLoss:true,reasons:[]
  },extra||{});
  loss.reasons=Array.isArray(loss.reasons)?[...new Set(loss.reasons.filter(v=>typeof v==='string'&&v.trim()).map(v=>v.trim()))]:[];
  state.losses.push(loss);
  return loss;
};
const removeLossesOfBatch=batchId=>{state.losses=state.losses.filter(l=>l.batchId!==batchId);};
const getSnooze=batchId=>state.snoozes.find(s=>s.batchId===batchId)||null;
const isSnoozed=batchId=>{const s=getSnooze(batchId);if(!s)return false;return s.forever||!!s.until&&todayStr()<s.until;};
const clearSnooze=batchId=>{state.snoozes=state.snoozes.filter(s=>s.batchId!==batchId);};
const buildMatIndex=()=>{
  const idx=new Map(),matMap=new Map(state.materials.map(m=>[m.id,m]));
  for(const b of state.batches){
    const e=idx.get(b.materialId)||{qty:0,active:[],earliest:null,everHad:false};
    e.everHad=true;
    if(b.status==='opened'||b.status==='unopened'){
      const q=Number(b.qty)||0;
      e.qty+=q;
      e.active.push(b);
      const m=matMap.get(b.materialId);
      if(q>1e-6&&m){const due=batchDueDate(b,m);if(due&&(!e.earliest||due<e.earliest))e.earliest=due;}
    }
    idx.set(b.materialId,e);
  }
  for(const e of idx.values())e.qty=roundQty(e.qty);
  return idx;
};
function* activeBatches(){
  for(const b of state.batches){
    if(b.status!=='opened'&&b.status!=='unopened')continue;
    if(!(Number(b.qty)>1e-6))continue;
    const m=getMat(b.materialId);if(!m||m.disabled)continue;
    const due=batchDueDate(b,m);if(!due)continue;
    yield{b,m,due};
  }
}
const getExpiryLists=()=>{
  const t=today(),n=state.settings.soonDays,todayList=[],soonList=[];
  for(const{b,m,due} of activeBatches()){
    if(isSnoozed(b.id))continue;
    const d=diffDays(t,due);
    if(d<=0)todayList.push({batch:b,mat:m,due,d});else if(d<=n)soonList.push({batch:b,mat:m,due,d});
  }
  const cmp=(a,b)=>a.due-b.due;todayList.sort(cmp);soonList.sort(cmp);return[todayList,soonList];
};
const lossTime=r=>{
  const n=Number(r.createdAt);
  if(n)return n;
  const d=parseDateStr(r.date);
  return d?d.getTime():0;
};
const latestUsedAt=m=>{
  let max=0;
  state.batches.forEach(b=>{
    if(b.materialId!==m.id||!b.usedDate)return;
    const d=parseDateStr(b.usedDate);
    if(d&&d.getTime()>max)max=d.getTime();
  });
  return max;
};
const latestLossAt=m=>{
  let max=0;
  state.losses.forEach(r=>{
    if(r.materialId?r.materialId!==m.id:r.materialName!==m.name)return;
    const t=lossTime(r);
    if(t>max)max=t;
  });
  return max;
};
const agoLabel=ts=>{
  if(!ts)return '—';

  return d<=0?'今天':d===1?'昨天':`${d} 天前`;
};
const weekStart=()=>{const t=today();return addDays(t,-((t.getDay()+6)%7));};
const weekLossCount=()=>{const start=weekStart().getTime();return state.losses.filter(r=>lossTime(r)>=start).length;};
const latestLoss=()=>state.losses.slice().sort((a,b)=>lossTime(b)-lossTime(a))[0]||null;
const timeAgo=ts=>{
  if(!ts)return '—';
  const diff=Math.max(0,Date.now()-ts);
  if(diff<60e3)return '刚刚';
  if(diff<3600e3)return `${Math.floor(diff/60e3)} 分钟前`;
  if(diff<86400e3)return `${Math.floor(diff/3600e3)} 小时前`;
  return `${Math.floor(diff/86400e3)} 天前`;
};
const topLosses=()=>{
  const map=new Map();
  state.losses.forEach(r=>{
    const key=r.materialId||r.materialName||'?';
    const e=map.get(key)||{name:r.materialName||'未知',unit:r.unit||'',count:0,qty:0};
    e.count++;e.qty+=Number(r.qty)||0;if(r.unit)e.unit=r.unit;
    map.set(key,e);

  return [...map.values()].sort((a,b)=>b.count-a.count||b.qty-a.qty).slice(0,5);
};
const recentMaterialIds=(limit=5)=>{
  const ids=[],seen=new Set();
  state.batches.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(b=>{
    if(ids.length>=limit||seen.has(b.materialId))return;
    const m=getMat(b.materialId);if(!m||m.disabled)return;
    seen.add(b.materialId);ids.push(b.materialId);
  });
  return ids;
};
const matUrgency=(e,t)=>{
  if(!e||!e.active.some(b=>Number(b.qty)>1e-6))return 3;
  if(!e.earliest)return 2;
  return diffDays(t,e.earliest)<=0?0:1;
};
const healthReport=()=>{
  const t=today(),idx=buildMatIndex(),noRule=[],noDue=[],overdue=[],never=[];
  for(const m of state.materials){
    if(m.disabled)continue;
    if(!getRule(m.ruleId))noRule.push(m);
    if(!(idx.get(m.id)?.everHad))never.push(m);
  }
  for(const b of state.batches){
    if(b.status!=='opened'&&b.status!=='unopened')continue;
    if(!(Number(b.qty)>1e-6))continue;
    const m=getMat(b.materialId);if(!m||m.disabled)continue;
    const due=batchDueDate(b,m);
    if(!due)noDue.push({b,m});
    else{const d=diffDays(t,due);if(d<0)overdue.push({b,m,due,d});}
  }
  noDue.sort((a,b)=>a.m.name.localeCompare(b.m.name,'zh-CN'));
  overdue.sort((a,b)=>a.due-b.due);
  const dupMap=new Map();
  state.losses.forEach(r=>{
    const key=[r.materialId||r.materialName,r.date,roundQty(r.qty),r.note||'',r.fullLoss?'1':'0'].join('|');
    const arr=dupMap.get(key)||[];arr.push(r);dupMap.set(key,arr);
  });
  const dup=[...dupMap.values()].filter(g=>g.length>1).sort((a,b)=>b.length-a.length);
  return{noRule,noDue,overdue,never,dup,total:noRule.length+noDue.length+overdue.length+never.length+dup.length};
};

      return a.name.localeCompare(b.name,'zh-CN');
    });
  }else if(stockSort==='expiry'){
    mats.sort((a,b)=>{
      const eA=idx.get(a.id)?.earliest,eB=idx.get(b.id)?.earliest;
      if(!eA&&!eB)return 0;if(!eA)return 1;if(!eB)return -1;
      return eA-eB;
    });
  }else if(stockSort==='qty'){
    mats.sort((a,b)=>qtyOf(a.id)-qtyOf(b.id));
  }
  mats.sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned));

  const qRaw=stockQuery.trim();
  let body='<div class="stock-grid" id="stockGrid">'+mats.map(m=>matCardHtml(m,idx.get(m.id))).join('');
  body+=`<div class="empty" id="stockEmpty"${mats.length?' style="display:none"':''}><span id="stockEmptyText">${qRaw?'没有匹配的物料':'暂无物料'}</span><br><button class="btn p mini" id="stockEmptyAdd" style="margin-top:12px${qRaw?'':';display:none'}" data-action="open-add-material" data-name="${esc(qRaw)}">＋ 新建“${esc(qRaw)}”</button></div>`;
  body+='</div>';

  const shopBtn=(stockView==='low'||stockView==='out')?`<div class="group-card" style="margin-top:12px;padding:10px 14px;display:flex;align-items:center;gap:8px"><div style="flex:1;font-size:13px;color:var(--text-2)">生成采购清单，复制后直接发采购</div><button class="btn p mini" data-action="copy-shoplist">复制清单</button></div>`:'';
  return topBar+body+shopBtn+`<div class="group-card" style="margin-top:16px"><div class="row" data-action="open-add-material" style="justify-content:center;color:var(--brand);font-weight:600">＋ 新增物料</div></div>`;
};
const matCardHtml=(m,e)=>{
  e=e||{qty:0,active:[],earliest:null,everHad:false};
  const q=roundQty(e.qty),bs=e.active,low=state.settings.lowStock,soonDays=state.settings.soonDays;
  const tags=[],ruleMissing=!getRule(m.ruleId);
  const expired=!!(!m.disabled&&e.earliest&&diffDays(today(),e.earliest)<0);

  if(m.disabled) tags.push('<span class="scard-tag gy">已停用</span>');
  else {
    if(m.isPrepared) tags.push('<span class="scard-tag p">预制</span>');
    if(ruleMissing) tags.push('<span class="scard-tag r">⚠无规则</span>');
    if(e.everHad){
      if(q<=0)tags.push('<span class="scard-tag r">断货</span>');
      else if(q<=low)tags.push('<span class="scard-tag y">低库存</span>');
    }
    if(e.earliest){
      const dd=diffDays(today(),e.earliest);
      if(dd<0)tags.push(`<span class="scard-tag r">过期${-dd}天</span>`);
      else if(dd===0)tags.push('<span class="scard-tag r">今日到期</span>');
      else tags.push(`<span class="scard-tag ${dd<=soonDays?'y':'g'}">剩${dd}天</span>`);
    }else if(bs.length>0&&!ruleMissing){
      const hasUnopenedRule=m.unopenedType&&m.unopenedType!=='none'&&m.unopenedValue>0;
      const allUnopened=bs.every(b=>b.status==='unopened');
      if(allUnopened&&!hasUnopenedRule)tags.push('<span class="scard-tag gy">未设到期</span>');
      else tags.push('<span class="scard-tag r">⚠无到期</span>');
    }else if(!e.everHad&&!ruleMissing){
      tags.push('<span class="scard-tag gy">无批次</span>');
    }
  }

  let qcls='';if(!m.disabled&&e.everHad){if(q<=0)qcls='z';else if(q<=low)qcls='lw';}
  let opQty=0,unopQty=0;for(const b of bs){if(b.status==='opened')opQty+=Number(b.qty)||0;else unopQty+=Number(b.qty)||0;}
  const detail=(opQty>0||unopQty>0)?`<div class="scard-detail">${[opQty>0?'已开 '+roundQty(opQty):'',unopQty>0?'未开 '+roundQty(unopQty):''].filter(Boolean).join(' · ')}</div>`:'';

  let catDisplay=m.categories[0]||'';
  if(stockView.startsWith('cat:')){const c=stockView.slice(4);if(m.categories.includes(c))catDisplay=c;}

  return `<div class="scard${expired?' expired':''}" data-action="open-mat-detail" data-id="${esc(m.id)}" data-name="${esc(m.name.toLowerCase())}" data-alias="${esc((m.alias||'').toLowerCase())}"><div class="scard-head"><div class="scard-name" title="${esc(m.name)}">${esc(m.name)}</div><button class="pin-btn ${m.pinned?'on':''}" data-action="toggle-pin" data-id="${esc(m.id)}" title="${m.pinned?'取消置顶':'置顶'}" aria-label="${m.pinned?'取消置顶':'置顶'}" aria-pressed="${m.pinned?'true':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 7 3 3H7l3-3-1-7zM12 13v8"/></svg></button></div><div class="scard-qty ${qcls}">${q}<span>${esc(m.unit||'')}</span></div>${detail}<div class="scard-foot"><span class="scard-cat">${esc(catDisplay)}</span><span class="scard-tags">${tags.join('')}</span></div></div>`;
};
const applyStockFilter=()=>{

  const raw=inp.value.trim(),q=raw.toLowerCase();

  document.querySelectorAll('#stockGrid .scard').forEach(card=>{

};

let toastTimer=null,toastUndo=null,sheetTimer=null;
const showToast=(msg,undo)=>{
  const on=undo===true&&undoStack.length>0&&Date.now()-lastUndoAt<2500;
  const t=$('toast');
  t.innerHTML=`<span>${esc(msg)}</span>${on?'<button class="tu" data-action="toast-undo">撤销</button>':''}`;
  t.classList.add('show');
  toastUndo=on;
  clearTimeout(toastTimer);
  const duration = on ? 6000 : 3500;
  toastTimer=setTimeout(()=>{$('toast').classList.remove('show');toastUndo=null;},duration);
};
const openSheet=html=>{
  clearTimeout(sheetTimer);

  sheet.scrollTop=0;
  $('mask').classList.add('show');
  sheet.onclick=e=>{
    if(e.target.closest('input,select,textarea,button,.cl,.chk-row'))return;
    if(document.activeElement&&document.activeElement.tagName==='INPUT')document.activeElement.blur();
  };
};
const closeSheet=()=>{$('mask').classList.remove('show');sheetTimer=setTimeout(()=>{if(!$('mask').classList.contains('show'))$('sheet').innerHTML='';},280);};

const undoLast=()=>{
  const item=undoStack.pop();
  if(!item){showToast('没有可撤销的操作');return false;}
  const backup=state;
  undoRestoring=true;
  state=normalizeState(JSON.parse(item.snapshot));
  const ok=persist();
  undoRestoring=false;
  if(!ok){state=backup;undoStack.push(item);return false;}
  if(stockView.startsWith('cat:')&&!state.categories.includes(stockView.slice(4)))stockView='';
  closeSheet();
  render(true);
  showToast(`已撤销：${item.label}`);
  return true;
};

const sheetFooter=(action,id)=>`<div class="rbtn"><button class="btn gh" data-action="close-sheet">取消</button><button class="btn p" data-action="${action}" data-id="${esc(id ?? '')}">保存</button></div>`;
const readBatchForm=()=>({matId:gv('f_mat'),qty:Math.max(0,roundQty(gv('f_qty'))),status:gv('f_status'),openStr:normDate(gv('f_open')),exp:normDate(gv('f_exp')),note:gv('f_note').trim()});
const bindCheckboxGroups=()=>{document.querySelectorAll('.cl input').forEach(cb=>cb.addEventListener('change',function(){this.parentElement.classList.toggle('chk',this.checked);}));};

/* ===== 各类 Sheet ===== */
const matDetailSheet=id=>{
  const m=getMat(id);if(!m)return;
  const e=buildMatIndex().get(m.id)||{qty:0,active:[]};const qty=roundQty(e.qty);
  const dueOf=b=>batchDueDate(b,m);
  const bs=e.active.slice().sort((a,b)=>{
    const da=dueOf(a),db=dueOf(b);
    if(da&&db)return da-db;
    if(da)return -1;
    if(db)return 1;
    if(a.status!==b.status)return a.status==='opened'?-1:1;
    return(a.openDate||a.createDate||'9999').localeCompare(b.openDate||b.createDate||'9999');
  });
  const rowsHtml=bs.length?bs.map(b=>{
    const{due,ruleLabel}=describeBatch(b,m);
    const isExpired=due&&diffDays(today(),due)<0;
    const sn=isSnoozed(b.id)?getSnooze(b.id):null;
    let info,sub;
    if(b.status==='opened'){info=`${shortDate(b.openDate)||'—'} → ${due?shortDate(toDateStr(due)):'—'}`;sub=b.expireDate?'指定到期':(ruleLabel||'⚠无规则');}
    else{info=b.expireDate?`指定到期 ${shortDate(b.expireDate)}`:(due?`推算到期 ${shortDate(toDateStr(due))}`:'未开封');sub=b.createDate?`入库 ${shortDate(b.createDate)}`:'';}
    const badge=b.status==='opened'?'<span class="badge g">已开封</span>':'<span class="badge gy">未开封</span>';

    const mainAct=b.qty>1e-6?(b.status==='unopened'?`<button class="btn xs p" data-action="quick-open-batch" data-id="${esc(b.id)}">开封</button>`:`<button class="btn xs gh" data-action="quick-used" data-id="${esc(b.id)}">用完</button>`):'';
    const plusOneAct=b.status==='opened'?`<button class="btn xs gh" data-action="extend-batch" data-id="${esc(b.id)}">+1天</button>`:'';
    const snoozeAct=sn?`<button class="btn xs gh" data-action="unsnooze" data-id="${esc(b.id)}" title="恢复到期提醒">🔔</button>`:'';

    const textStyle=isExpired?'color:var(--red);font-weight:600;':'';
    const expTag=isExpired?` <span class="badge r" style="margin-left:4px">过期${-diffDays(today(),due)}天</span>`:'';
    const snTag=sn?' <span class="badge gy" style="margin-left:4px">已稍后</span>':'';

    return `<div class="brow batch-row"><div class="bi"><div class="bt" style="${textStyle}">${badge}${esc(info)}${expTag}${snTag}</div>${sub?`<div class="bs">${esc(sub)}</div>`:''}</div><span class="bq">${roundQty(b.qty)}${esc(m.unit||'')}</span>${plusOneAct}${mainAct}${snoozeAct}<button class="btn xs gh" data-action="open-edit-batch" data-id="${esc(b.id)}">⋯</button></div>`;
  }).join(''):(m.disabled?'<div class="empty">暂无批次</div>':`<div class="empty">暂无批次<br><button class="btn p mini" data-action="open-add-batch" data-id="${esc(m.id)}">＋ 添加批次</button></div>`);

  let quickActions='';
  if(m.isPrepared&&!m.disabled){
    quickActions=`<div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn p" style="flex:1;background:var(--green);font-size:15px" data-action="quick-make-sheet" data-id="${esc(m.id)}">＋ 一键制作</button>
      <button class="btn d" style="flex:1;font-size:15px" data-action="quick-clean" data-id="${esc(m.id)}">一键过期清理</button>
    </div>`;
  }

  const addBatchBtn=m.disabled?'':`<button class="btn p" data-action="open-add-batch" data-id="${esc(m.id)}">＋ 自定义批次</button>`;
  const btnHtml=`<div class="rbtn"><button class="btn gh" data-action="open-edit-material" data-id="${esc(m.id)}">编辑物料</button>${addBatchBtn}</div><div class="rbtn"><button class="btn gh" data-action="close-sheet">关闭</button></div>`;
  const usedAt=latestUsedAt(m),lossAt=latestLossAt(m);
  const timeline=(usedAt||lossAt)
    ?`<div class="mat-timeline"><span>上次用完 <b>${agoLabel(usedAt)}</b></span><span class="dot">·</span><span>上次报损 <b>${agoLabel(lossAt)}</b></span></div>`
    :'<div class="mat-timeline muted">暂无用完 / 报损记录，使用一段时间后会显示消耗节奏</div>';

  openSheet(`<h3>${esc(m.name)} <span style="font-size:14px;color:var(--text-2);font-weight:400">当前库存: ${qty}${esc(m.unit||'')}</span></h3>${timeline}${quickActions}<div class="group-card" style="margin-bottom:12px">${rowsHtml}</div>${btnHtml}`);
};

const batchManageCatSheet=cat=>{
  const rowsHtml=state.materials.map(m=>{
    const on=m.categories.includes(cat);
    return `<label class="cl ${on?'chk':''}" data-name="${esc(m.name.toLowerCase())}"><input type="checkbox" name="cat_mats" value="${esc(m.id)}" ${on?'checked':''}> ${esc(m.name)}</label>`;
  }).join('');
  openSheet(`<h3>管理「${esc(cat)}」中的物料</h3><div class="search-wrap" style="margin-bottom:12px;background:var(--bg)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="text" id="catSearch" placeholder="搜索物料..."></div><div class="cbg" id="catList" style="max-height:50vh;overflow-y:auto">${rowsHtml}</div>${sheetFooter('save-batch-cat',cat)}`);
  bindCheckboxGroups();
  $('catSearch').addEventListener('input',function(){const q=this.value.trim().toLowerCase();document.querySelectorAll('#catList .cl').forEach(el=>{el.style.display=el.dataset.name.includes(q)?'':'none';});});
};

const batchSheet=(id,preMat)=>{
  const b=id?getBatch(id):null;
  const curMat=b?b.materialId:(preMat||(state.materials[0]&&state.materials[0].id)||'');
  const opt=x=>`<option value="${esc(x.id)}" ${x.id===curMat?'selected':''}>${esc(x.name)}</option>`;
  const recent=recentMaterialIds();
  const recentOpts=recent.map(id=>getMat(id)).filter(Boolean).map(opt).join('');
  const restOpts=state.materials.filter(x=>!recent.includes(x.id)).map(opt).join('');
  const opts=(recent.length?`<optgroup label="最近用过">${recentOpts}</optgroup>`:'')+`<optgroup label="全部物料">${restOpts}</optgroup>`;
  const statusOpts=(b?['opened','unopened','used','lost']:['opened','unopened']).map(v=>`<option value="${v}" ${(b?b.status:'opened')===v?'selected':''}>${STATUS_TXT[v]}</option>`).join('');

  const last=state.batches.filter(x=>x.materialId===curMat).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0))[0];
  const defaultQty=b?b.qty:(last?last.qty:1);
  
  openSheet(`<h3>${b?'编辑批次':'新增批次'}</h3>
  <label>物料<select id="f_mat">${opts}</select></label>
  <label>数量（<span id="f_unit_txt">${esc(unitOf(curMat))}</span>）<input id="f_qty" type="number" step="0.1" min="0" value="${defaultQty}"></label>
  <label>状态<select id="f_status">${statusOpts}</select></label>
  <label>开封/入库日期<input id="f_open" type="date" value="${esc(b?(b.openDate||b.createDate||''):todayStr())}"></label>
  <label>指定到期日（选填，优先于规则）<input id="f_exp" type="date" value="${esc(b?b.expireDate||'':'')}"></label>
  <label>备注（选填）<input id="f_note" type="text" value="${esc(b?b.note||'':'')}"></label>
  ${sheetFooter('save-batch',id||'')}${b?`<div class="rbtn"><button class="btn d" data-action="delete-batch" data-id="${esc(b.id)}">删除该批次</button></div>`:''}`);
  $('f_mat').addEventListener('change',function(){$('f_unit_txt').textContent=unitOf(this.value);});
};

const materialSheet=(id,preName)=>{
  const m=id?getMat(id):null;
  const catsHtml=state.categories.map(c=>{
    const on=!!(m&&m.categories.includes(c));
    return `<label class="cl ${on?'chk':''}"><input type="checkbox" name="m_cats" value="${esc(c)}" ${on?'checked':''}> ${esc(c)}</label>`;
  }).join('');
  const rules=state.rules.map(r=>`<option value="${esc(r.id)}" ${m&&m.ruleId===r.id?'selected':''}>${esc(r.name)}（${ruleTxt(r)}）</option>`).join('');
  const ut=m?.unopenedType||'none',uv=m?.unopenedValue||0;
  const isDisabled=!!m?.disabled;
  const defName=esc(m?m.name:(preName||''));
  const defAlias=esc(m?.alias||'');
  
  openSheet(`<h3>${m?'编辑物料':'新增物料'}</h3>
  <label>物料名<input id="m_name" type="text" value="${defName}"></label>
  <label>搜索别名（选填，如输入 tnny 代表泰奶奶油）<input id="m_alias" type="text" value="${defAlias}" placeholder="支持拼音首字母或英文"></label>
  <label>所属分类（可多选）<div class="cbg">${catsHtml}</div></label><label>开封效期规则<select id="m_rule">${rules}</select></label><label>未开封保质期单位<select id="m_ut"><option value="none" ${ut==='none'?'selected':''}>不设置</option><option value="days" ${ut==='days'?'selected':''}>天</option><option value="months" ${ut==='months'?'selected':''}>月</option></select></label><label>未开封保质期数值<input id="m_uv" type="number" min="0" value="${uv}"></label><label>基准单位<input id="m_unit" type="text" list="unitPresets" value="${m?esc(m.unit||'瓶'):'瓶'}"></label><datalist id="unitPresets">${['瓶','盒','包','袋','罐','块','杯','支'].map(u=>`<option value="${u}"></option>`).join('')}</datalist>
  
  <label class="chk-row">
    <input type="checkbox" id="m_is_prepared" ${m&&m.isPrepared?'checked':''}> 
    <div style="display:flex;flex-direction:column">
      <span>短保预制/自制类</span>
      <span class="sub">（开启后详情页显示快捷制作按钮）</span>
    </div>
  </label>
  
  <label class="chk-row">
    <input type="checkbox" id="m_disabled" ${isDisabled?'checked':''}> 
    <div style="display:flex;flex-direction:column">
      <span>暂停使用</span>
      <span class="sub">（从库存及提醒中隐藏，保留历史记录）</span>
    </div>
  </label>
  
  ${sheetFooter('save-material',id||'')}${m?`<div class="rbtn"><button class="btn d" data-action="delete-material" data-id="${esc(m.id)}">彻底删除该物料</button></div>`:''}`);
  bindCheckboxGroups();
};

const catSheet=idx=>{
  const isNew=(idx==null),name=isNew?'':(state.categories[idx]||''),cnt=isNew?0:state.materials.filter(m=>m.categories.includes(name)).length;
  openSheet(`<h3>${isNew?'新增分类':'编辑分类'}</h3><label>分类名<input id="c_name" type="text" value="${esc(name)}" placeholder="如：自制类物料"></label>${!isNew?`<div class="hint">该分类下有 ${cnt} 个物料。</div>`:''}${sheetFooter('save-cat',isNew?'':idx)}${!isNew?`<div class="rbtn"><button class="btn d" data-action="del-cat" data-idx="${idx}">删除分类</button></div>`:''}`);
};

const ruleSheet=id=>{
  const r=id?getRule(id):null;
  openSheet(`<h3>${r?'编辑规则':'新增规则'}</h3><label>规则名<input id="r_name" type="text" value="${r?esc(r.name):''}"></label><label>类型<select id="r_type"><option value="days" ${r&&r.type==='days'?'selected':''}>按天数（D+n）</option><option value="months" ${r&&r.type==='months'?'selected':''}>按月</option></select></label><label>数值<input id="r_val" type="number" min="0" value="${r?r.value:6}"></label>${sheetFooter('save-rule',id||'')}`);
};

const calDaySheet=ds=>{
  const list=[...activeBatches()].filter(x=>toDateStr(x.due)===ds);
  if(!list.length){showToast('该天没有到期批次');return;}
  const rows=list.map(({b,m})=>{const{ruleLabel}=describeBatch(b,m);return `<div class="brow"><div class="bi"><div class="bt">${esc(m.name)} <span class="badge ${b.status==='opened'?'g':'gy'}">${b.status==='opened'?'已开封':'未开封'}</span></div><div class="bs">${b.openDate?shortDate(b.openDate)+' 开封 · ':''}${roundQty(b.qty)}${esc(m.unit||'')}${ruleLabel?'（'+ruleLabel+'）':''}</div></div></div>`;}).join('');
  openSheet(`<h3>${esc(ds)} 到期批次</h3><div class="group-card">${rows}</div><div class="rbtn"><button class="btn gh" data-action="close-sheet">关闭</button></div>`);
};

const lossSheet=batchId=>{
  const b=getBatch(batchId);if(!b)return;
  if(b.status==='lost'){showToast('该批次已报损');return;}
  const m=getMat(b.materialId);if(!m)return;
  const avail=Number(b.qty)||0;if(!(avail>0)){showToast('数量为 0，无需报损');return;}
  const{due}=describeBatch(b,m);
  const reasons=['过期','做错','打翻','测试','其他'].map(x=>`<span class="tag-btn" data-action="toggle-loss-reason" data-reason="${x}">${x}</span>`).join('');
  openSheet(`<h3>报损「${esc(m.name)}」</h3>
  <div class="hint" style="margin-bottom:12px">当前批次 ${roundQty(avail)}${esc(m.unit||'')}${b.openDate?'，开封 '+shortDate(b.openDate):''}，应报损 ${due?shortDate(toDateStr(due)):'—'}</div>
  <label>报损数量<input id="loss_qty" type="number" inputmode="decimal" step="0.01" min="0.01" max="${avail}" value="${roundQty(avail)}"></label>
  <label>备注（选填）<input id="loss_note" type="text" value="${esc(b.note||'')}" placeholder="补充说明（选填）"></label>
  <div class="hint" style="margin:2px 0 6px">报损原因（可多选）</div>
  <div id="lossReasons" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">${reasons}</div>
  <div class="rbtn"><button class="btn gh" data-action="close-sheet">取消</button><button class="btn loss" data-action="do-loss" data-id="${esc(b.id)}">确认报损</button></div>`);
};

const snoozeSheet=batchId=>{
  const b=getBatch(batchId);if(!b)return;
  const m=getMat(b.materialId);if(!m)return;
  const sn=getSnooze(batchId);
  openSheet(`<h3>稍后处理「${esc(m.name)}」</h3>
  <div class="hint" style="margin-bottom:12px">当前提醒不会消失，只是暂时不在首页出现${sn?'（已设置稍后）':''}。</div>
  <div class="snooze-grid">
    <button class="btn gh" data-action="do-snooze" data-id="${esc(b.id)}" data-days="1">明天</button>
    <button class="btn gh" data-action="do-snooze" data-id="${esc(b.id)}" data-days="3">3 天后</button>
    <button class="btn gh" data-action="do-snooze" data-id="${esc(b.id)}" data-days="7">1 周后</button>
    <button class="btn d" data-action="do-snooze" data-id="${esc(b.id)}" data-days="9999">不再提醒</button>
  </div>
  ${sn?`<div class="rbtn"><button class="btn gh" data-action="unsnooze" data-id="${esc(b.id)}">恢复提醒</button></div>`:''}
  <div class="rbtn"><button class="btn gh" data-action="close-sheet">取消</button></div>`);
};

const cardMenuSheet=matId=>{
  const m=getMat(matId);if(!m)return;
  const e=buildMatIndex().get(matId)||{qty:0,active:[]};
  const active=e.active.filter(b=>Number(b.qty)>1e-6).sort((a,b)=>{
    const da=batchDueDate(a,m),db=batchDueDate(b,m);
    if(da&&db)return da-db;if(da)return -1;if(db)return 1;return 0;
  });
  const first=active.find(b=>b.status==='unopened'&&b.qty>1e-6);
  const earliest=active[0];
  const info=active.length?`${active.length} 个批次 · 库存 ${roundQty(e.qty)}${esc(m.unit||'')}`:'暂无批次';
  openSheet(`<h3>${esc(m.name)}</h3><div class="hint" style="margin-bottom:12px">长按快捷操作 · ${info}</div>
  <div class="rbtn">${m.disabled?'':`<button class="btn p" data-action="open-add-batch" data-id="${esc(m.id)}">＋ 添加批次</button>`}${first&&!m.disabled?`<button class="btn gh" data-action="card-open-first" data-id="${esc(first.id)}">开封第一瓶</button>`:''}</div>
  <div class="rbtn">${earliest?`<button class="btn loss" data-action="card-loss-earliest" data-id="${esc(earliest.id)}">报损最早批次</button>`:''}<button class="btn gh" data-action="open-edit-material" data-id="${esc(m.id)}">编辑物料</button></div>
  <div class="rbtn"><button class="btn gh" data-action="close-sheet">关闭</button></div>`);
};

const deleteMaterialSheet=id=>{
  const m=getMat(id);if(!m)return;
  const stock=state.batches.filter(b=>b.materialId===id&&(b.status==='opened'||b.status==='unopened')&&Number(b.qty)>1e-6);
  if(stock.length){
    openSheet(`<h3>暂时无法删除</h3><div class="danger-hint">「${esc(m.name)}」还有 ${stock.length} 个有库存批次，请先报损、用完或盘点清零后再删除。</div><div class="rbtn"><button class="btn gh" data-action="close-sheet">知道了</button></div>`);
    return;
  }
  openSheet(`<h3>彻底删除物料</h3>
  <div class="danger-hint">将删除「${esc(m.name)}」及其全部批次、报损记录和提醒设置，无法直接恢复（可用撤销挽回）。</div>
  <label>请输入物料名 <b>${esc(m.name)}</b> 以确认<input id="delMatConfirm" type="text" autocomplete="off" autocapitalize="off"></label>
  <div class="rbtn"><button class="btn gh" data-action="close-sheet">取消</button><button class="btn loss" data-action="do-delete-material" data-id="${esc(m.id)}">确认删除</button></div>`);
};

const resetConfirmSheet=()=>{
  openSheet(`<h3>清空全部数据</h3>
  <div class="danger-hint">将删除全部物料、批次、报损记录和设置，恢复到默认数据。请输入 <b>清空全部</b> 以确认。</div>
  <label>确认文字<input id="resetConfirm" type="text" autocomplete="off" autocapitalize="off" placeholder="清空全部"></label>
  <div class="rbtn"><button class="btn gh" data-action="close-sheet">取消</button><button class="btn loss" data-action="do-reset-all">确认清空</button></div>`);
};

const snapshotTime=s=>{const d=new Date(s.at);return `${toDateStr(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const snapshotSheet=()=>{
  const rows=[...snapshots].reverse().map(s=>`<div class="brow"><div class="bi"><div class="bt">${esc(s.label)}</div><div class="bs">${snapshotTime(s)} · ${(JSON.stringify(s.state).length/1024).toFixed(0)} KB</div></div><button class="btn xs gh" data-action="restore-snapshot" data-id="${esc(s.id)}">恢复</button></div>`).join('');
  openSheet(`<h3>本地快照</h3><div class="hint" style="margin-bottom:12px">每日首次打开和危险操作前自动保存，最多保留 ${SNAP_MAX} 份；只存在本机。</div><div class="group-card">${rows||'<div class="empty">还没有本地快照</div>'}</div><div class="rbtn"><button class="btn p" data-action="create-snapshot">立即保存一份</button><button class="btn gh" data-action="close-sheet">关闭</button></div>`);
};

const restoreSnapshot=snapId=>{
  const snap=snapshots.find(s=>s.id===snapId);if(!snap)return;
  if(!confirm(`恢复到「${snap.label}」的快照？当前数据会先自动保存一份。`))return;
  addSnapshot('恢复前快照');
  const backup=state;
  currentActionLabel='恢复本地快照';
  state=normalizeState(JSON.parse(JSON.stringify(snap.state)));
  if(!persist()){state=backup;return;}
  currentTab='home';
  closeSheet();resetUI();render(false);
  showToast(`已恢复：${snap.label}`,true);
};

const quickOpenSheet=batchId=>{
  const b=state.batches.find(x=>x.id===batchId);if(!b||b.status!=='unopened')return;
  const m=getMat(b.materialId);if(!m)return;
  const avail=roundQty(b.qty);
  openSheet(`<h3>开封「${esc(m.name)}」</h3><div class="hint">未开封库存 ${avail}${esc(m.unit||'')}，开封后从该批次扣减并生成已开封批次。</div><label>开封数量<input id="qo_qty" type="number" inputmode="decimal" step="0.1" min="0.01" max="${avail}" value="1"></label><div class="rbtn"><button class="btn gh" data-action="close-sheet">取消</button><button class="btn p" data-action="do-quick-open" data-id="${esc(b.id)}">确认开封</button></div>`);
};

const quickMakeSheet=(matId)=>{
  const m=getMat(matId);if(!m)return;
  const lastBatch = state.batches.filter(b=>b.materialId===matId && b.status==='opened').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  const defaultQty = lastBatch ? lastBatch.qty : 1;
  
  openSheet(`<h3>制作「${esc(m.name)}」</h3>
  <div class="hint" style="margin-bottom:12px">选择制作数量（默认按上次数量：${defaultQty}${esc(m.unit||'')}）</div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <button class="btn p" style="flex:1" data-action="do-quick-make" data-id="${esc(matId)}" data-qty="1">+ 1</button>
    <button class="btn p" style="flex:1" data-action="do-quick-make" data-id="${esc(matId)}" data-qty="2">+ 2</button>

const undoLossById=lossId=>{
  const rec=state.losses.find(x=>x.id===lossId);if(!rec)return false;
  if(!rec.batchId){showToast('盘点生成的账目不支持撤销');return false;}
  const b=getBatch(rec.batchId);
  if(!b){showToast('批次已被清理，无法撤销');return false;}
  const full=rec.fullLoss!==false;
  if(full){
    if(b.status!=='lost'){showToast('批次已被修改，无法撤销');return false;}
    b.status=rec.prevStatus||'opened';
    b.qty=roundQty(rec.prevQty!=null?rec.prevQty:rec.qty);
    delete b.lossDate;
  }else{
    if(b.status==='lost'){showToast('批次已被修改，无法撤销');return false;}
    b.qty=roundQty((Number(b.qty)||0)+Number(rec.qty||0));
    if(b.status==='used'){b.status='opened';delete b.usedDate;}
  }
  state.losses=state.losses.filter(x=>x.id!==lossId);
  return persist();
};
const doLoss=(batchId,qty,note,reasons)=>{
  const b=getBatch(batchId);if(!b)return;
  if(b.status==='lost'){showToast('该批次已报损');return;}
  const avail=Number(b.qty)||0;if(!(avail>0)){showToast('数量为 0，无需报损');return;}
  let lossQty=Math.min(roundQty(qty),avail);
  if(!(lossQty>0)){showToast('报损数量需大于 0');return;}
  const m=getMat(b.materialId);if(!m)return;
  const full=lossQty>=avail-1e-6;
  const loss=pushLoss(b,m,lossQty,(note||'').trim(),{prevQty:avail,fullLoss:full,reasons:reasons||[]});
  if(full){b.status='lost';b.lossDate=todayStr();}else{b.qty=roundQty(avail-lossQty);}
  if(!persist())return;render(true);closeSheet();
  vib(20);
  showToast(`已报损「${m.name}」${lossQty}${m.unit||''}${full?'':'（部分）'}`,true);
};
const quickUsed=batchId=>{
  const b=getBatch(batchId);if(!b)return;
  const m=getMat(b.materialId);
  b.qty=0;b.status='used';b.usedDate=todayStr();if(!persist())return;render(true);matDetailSheet(b.materialId);
  vib(15);
  showToast(m?`已用完「${m.name}」`:'已用完',true);
};
const doQuickOpen=(batchId,qty)=>{
  const b=getBatch(batchId);if(!b||b.status!=='unopened')return;
  const m=getMat(b.materialId);if(!m)return;
  if(!getRule(m.ruleId)){showToast('该物料未设置开封效期规则，请先编辑物料');return;}
  let dec=qty!=null?Number(qty):Number(gv('qo_qty'));if(!(dec>0))dec=1;dec=Math.min(dec,Number(b.qty)||0);dec=roundQty(dec);
  if(!(dec>0)){showToast('数量需大于 0');return;}
  b.qty=roundQty((Number(b.qty)||0)-dec);
  if(b.qty<=1e-6){b.qty=0;b.status='used';b.usedDate=todayStr();}
  const nb={id:uid('b'),materialId:b.materialId,qty:dec,status:'opened',openDate:todayStr(),expireDate:'',note:b.note?b.note+' · 拆分开封':'批次开封',createDate:todayStr(),createdAt:Date.now()};
  state.batches.push(nb);
  if(!persist())return;render(true);matDetailSheet(b.materialId);
  vib(15);
  showToast(`已开封 ${dec}${m.unit||''}「${m.name}」`,true);
};
const doQuickMake=(matId,qty)=>{
  const m=getMat(matId); if(!m)return;
  if(!getRule(m.ruleId)){showToast('该物料未设置开封效期规则，请先编辑物料');return;}
  let finalQty = Number(qty);
  if(finalQty === -1){
    finalQty = Number(gv('qm_qty'));
    if(!(finalQty>0)) { showToast('请输入有效数量'); return; }
  }
  finalQty = roundQty(finalQty);
  if(!(finalQty>0)){showToast('数量需大于 0');return;}

  const now = Date.now();
  if (lastMake.id === matId && now - lastMake.time < 1000) { showToast('操作太快啦，请勿重复点击'); return; }
  lastMake = { id: matId, time: now };
  
  const nb={id:uid('b'),materialId:m.id,qty:finalQty,status:'opened',openDate:todayStr(),expireDate:'',createDate:todayStr(),note:'快捷制作',createdAt:now};
  state.batches.push(nb);
  if(!persist())return; 
  render(true); 
  vib(20);
  showToast(`已制作 ${finalQty}${m.unit||''}「${m.name}」`,true);
  matDetailSheet(m.id);
};

const doStocktake=()=>{
  let changed=0; let surplus=0; let deficit=0;
  const markUsed=b=>{b.qty=0;b.status='used';b.usedDate=todayStr();};
  
  document.querySelectorAll('#countList .count-row').forEach(row=>{
    const el = row.querySelector('input');
    if(!el)return;
    const raw=el.value.trim();
    if(raw==='')return;
    const newQty=Math.max(0,roundQty(raw));
    const matId = el.dataset.id;
    const m = getMat(matId);
    if(!m)return;

    const active=state.batches.filter(b=>b.materialId===m.id&&(b.status==='opened'||b.status==='unopened'));
    const cur=roundQty(active.reduce((s,b)=>s+(Number(b.qty)||0),0));
    if(Math.abs(newQty-cur)<1e-6)return;
    
    changed++;
    if(newQty < cur) deficit++; else surplus++;
    
    if(newQty<cur){
      let diff=roundQty(cur-newQty);
      pushLoss(null,m,diff,'盘点盘亏',{prevStatus:'opened',prevQty:cur,fullLoss:false});

      for(const b of active.slice().sort((a,b)=>(a.openDate||a.createDate||'').localeCompare(b.openDate||b.createDate||''))){
        if(diff<=1e-6)break;
        const d=Math.min(Number(b.qty)||0,diff);b.qty=roundQty((Number(b.qty)||0)-d);diff=roundQty(diff-d);
        if(b.qty<=1e-6)markUsed(b);
      }
    }else{
      const addQty=roundQty(newQty-cur);
      const nb={id:uid('b'),materialId:m.id,qty:addQty,status:'unopened',createDate:todayStr(),openDate:'',expireDate:'',note:'盘点补录',createdAt:Date.now()};
      if(m.unopenedType&&m.unopenedType!=='none'&&m.unopenedValue>0){
        const base=today();nb.expireDate=toDateStr(m.unopenedType==='months'?addMonths(base,m.unopenedValue):addDays(base,m.unopenedValue));
      }
      state.batches.push(nb);
    }
  });
  if(!changed){showToast('数量无变化');return;}
  if(!persist())return;
  closeSheet();render(true);
  vib(20);
  showToast(`盘点完成: 盘亏 ${deficit} 项, 盘盈 ${surplus} 项`,true);
};

const download=(filename,content,type)=>{const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);};
const csvCell=s=>`"${String(s==null?'':s).replace(/"/g,'""')}"`;
const downloadCSV=(name,headers,rows)=>{if(!rows.length){showToast('暂无数据');return;}const csv='\ufeff'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');download(`${name}_${todayStr()}.csv`,csv,'text/csv;charset=utf-8');};

const exportStockCSV=()=>{
  const t=today(),rows=[],idx=buildMatIndex();
  for(const m of state.materials){
    if(m.disabled)continue;
    const cats=m.categories.join(' / '),unit=m.unit||'';
    const bs=idx.get(m.id)?.active||[];

    for(const b of bs){

    }
  }
  downloadCSV('库存明细',['物料','分类','单位','批次状态','数量','开封日','入库日','推算到期日','剩余天数','规则','备注'],rows);

const copyShopList=()=>{
  const idx=buildMatIndex(),low=state.settings.lowStock;
  const getQ=m=>idx.get(m.id)?.qty||0;
  const hasHist=m=>idx.get(m.id)?.everHad||false;
  let mats=state.materials.filter(m=>!m.disabled && !m.isPrepared && hasHist(m) && getQ(m)<=low);
  if(stockView==='out')mats=mats.filter(m=>getQ(m)<=0);
  mats.sort((a,b)=>getQ(a)-getQ(b));
  if(!mats.length){showToast('当前筛选下没有需要采购的物料');return;}
  const items=mats.map(m=>{
    const q=getQ(m);
    return q<=0 ? `- ${m.name}（断货，预警线${low}）` : `- ${m.name} 剩 ${roundQty(q)}${m.unit||''}（预警线${low}）`;
  });
  const text=`采购清单（${todayStr()}）\r\n${items.join('\r\n')}`;
  /* 粘贴板：安全上下文走 Clipboard API；非安全上下文当场同步走 execCommand（保住用户手势） */
  const fallback=()=>{
    let ok=false;
    try{
      const ta=document.createElement('textarea');
      ta.value=text;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;outline:none;opacity:0;font-size:16px;';
      document.body.appendChild(ta);
      ta.focus();ta.select();
      try{ta.setSelectionRange(0,ta.value.length);}catch(e){}
      ok=document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ok=false;}
    if(ok){showToast('采购清单已复制');return;}
    alert('复制失败，请手动复制：\n\n'+text);
  };
  if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('采购清单已复制')).catch(fallback);
  }else{fallback();}
};

const handleFileSelect=e=>{
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    e.target.value='';
    try{
      const obj=JSON.parse(reader.result);
      if(!obj||!Array.isArray(obj.materials)||!Array.isArray(obj.batches))throw new Error('格式不符');
      if(!confirm('导入将覆盖当前全部数据，确定继续？'))return;
      addSnapshot('导入前');
      const backup=state;
      currentActionLabel='导入数据';
      state=normalizeState(obj);loadOK=true;
      if(!persist()){state=backup;return;}
      currentTab='home';
      closeSheet();resetUI();render(false);
      showToast('导入成功',true);
    }catch(err){alert('导入失败：'+err.message);}
  };
  reader.onerror=()=>{e.target.value='';alert('读取文件失败，请重试');};
  reader.readAsText(f);
};

    }
    case 'save-batch-cat':{
      const cat=el.dataset.id,checkedIds=Array.from(document.querySelectorAll('input[name="cat_mats"]:checked')).map(cb=>cb.value);
      state.materials.forEach(m=>{const hasCat=m.categories.includes(cat),shouldHave=checkedIds.includes(m.id);
        if(shouldHave&&!hasCat)m.categories.push(cat);
        if(!shouldHave&&hasCat){m.categories=m.categories.filter(c=>c!==cat);if(m.categories.length===0){m.categories.push(UNCAT);if(!state.categories.includes(UNCAT))state.categories.push(UNCAT);}}
      });
      if(saveAndClose())showToast('分类物料已更新',true);break;
    }
    /* 制作 */
    case 'quick-make-sheet':quickMakeSheet(id);break;
    case 'do-quick-make':doQuickMake(id, el.dataset.qty);break;
    /* 清理 */
    case 'quick-clean':{
      const m=getMat(id);if(!m)return;
      const t=today();let cleared=0;
      state.batches.filter(b=>b.materialId===id&&(b.status==='opened'||b.status==='unopened')&&Number(b.qty)>1e-6).forEach(b=>{
        const due=batchDueDate(b,m);
        if(!due||diffDays(t,due)>0)return;
        const rTxt=b.status==='unopened'
          ?(m.unopenedType==='months'?`未开封+${m.unopenedValue}月`:(m.unopenedType==='days'?`未开封+${m.unopenedValue}天`:'未开封到期'))
          :ruleTxt(ruleOfBatch(b,m));
        pushLoss(b,m,b.qty,'过期自动清理',{ruleTxt:rTxt,reasons:['过期']});
        b.status='lost';b.lossDate=todayStr();cleared++;
      });
      if(!cleared){showToast('目前没有过期的批次');return;}
      if(!persist())return;
      render(true);matDetailSheet(m.id);
      vib(20);
      showToast(`已清理 ${cleared} 个过期批次`,true);
      break;
    }
    case 'save-batch':{
      const isNew=!id;
      const b=isNew?{id:uid('b'),createdAt:Date.now()}:getBatch(id);
      if(!b){showToast('批次已不存在，请刷新');closeSheet();break;}
      const oldStatus=b.status||'';
      const f=readBatchForm();
      if(gv('f_qty').trim()===''){alert('请填写数量');return;}
      if(f.status==='opened'&&!f.openStr){alert('已开封批次请填写开封日期');return;}
      if(f.status==='unopened'&&!f.openStr)f.openStr=todayStr();

      const m=getMat(f.matId);
      const hasRule=m&&getRule(m.ruleId);
      if(f.status==='opened'&&!hasRule&&!f.exp){
        alert('该物料未设置开封效期规则，请先填写“指定到期日”，或去高级设置中添加规则！');
        return;
      }

      if(oldStatus==='lost'&&f.status!=='lost'&&state.losses.some(x=>x.batchId===b.id)){
        if(!confirm('该批次已报损，改回其他状态将删除对应报损记录，是否继续？'))return;
        removeLossesOfBatch(b.id);
        delete b.lossDate;
      }

      b.materialId=f.matId;b.qty=f.qty;b.expireDate=f.exp;b.note=f.note;

      if(f.status==='opened'){
        if(!b.createDate)b.createDate=f.openStr||todayStr();
        b.openDate=f.openStr;delete b.usedDate;delete b.lossDate;
      }else if(f.status==='unopened'){
        b.createDate=f.openStr||todayStr();b.openDate='';delete b.usedDate;delete b.lossDate;
      }else{
        if(f.openStr&&!b.openDate)b.openDate=f.openStr;
        if(f.status==='used'&&!b.usedDate)b.usedDate=todayStr();
        if(f.status==='lost'&&!b.lossDate)b.lossDate=todayStr();
      }

      if(f.status==='lost'&&oldStatus!=='lost'&&b.qty>0&&m)pushLoss(b,m,b.qty,b.note||'');

      b.status=f.status;
      if(b.qty<=0&&(b.status==='opened'||b.status==='unopened')){
        b.status='used';b.usedDate=todayStr();
      }
      if(isNew)state.batches.push(b);
      if(!saveAndClose())return;
      matDetailSheet(b.materialId);
      showToast('批次已保存',true);
      break;
    }
    case 'delete-batch':{
      if(!confirm('确认删除该批次？其关联的报损记录也会一并删除。'))return;
      state.batches=state.batches.filter(x=>x.id!==id);
      removeLossesOfBatch(id);
      clearSnooze(id);
      if(!saveAndClose())return;
      showToast('批次已删除',true);
      break;
    }
    case 'save-material':{
      const name=gv('m_name').trim(), alias=gv('m_alias').trim(), ruleId=gv('m_rule'),unit=gv('m_unit').trim()||'瓶',ut=gv('m_ut'),uv=clamp(gv('m_uv'),0,999,0);
      const disabled=$('m_disabled')?$('m_disabled').checked:false;
      const isPrepared=$('m_is_prepared')?$('m_is_prepared').checked:false; 
      const cats=Array.from(document.querySelectorAll('input[name="m_cats"]:checked')).map(cb=>cb.value);
      if(!name){alert('请填写物料名');return;}
      if(state.materials.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){alert('已存在同名物料，请换一个名称');return;}
      if(!cats.length){alert('请至少选择一个分类');return;}
      if(id){
        const m=getMat(id);
        if(m)Object.assign(m,{name,alias,categories:cats,ruleId,unit,unopenedType:ut,unopenedValue:uv,disabled,isPrepared}); 
        else {showToast('物料已不存在，可能已被删除');closeSheet();return;}
      }else{
        state.materials.push({id:uid('m'),name,alias,categories:cats,ruleId,unit,unopenedType:ut,unopenedValue:uv,disabled,isPrepared,pinned:false}); 
      }
      if(!saveAndClose())return;
      showToast('物料已保存',true);
      break;
    }
    case 'delete-material':deleteMaterialSheet(id);break;
    case 'do-delete-material':{
      const m=getMat(id);if(!m)return;
      if(gv('delMatConfirm').trim()!==m.name){alert('物料名不一致，未删除');return;}
      if(state.batches.some(b=>b.materialId===id&&(b.status==='opened'||b.status==='unopened')&&Number(b.qty)>0)){alert('无法删除：该物料下还有库存批次。');return;}
      addSnapshot('删除物料前');
      const batchIds=new Set(state.batches.filter(b=>b.materialId===id).map(b=>b.id));
      state.materials=state.materials.filter(x=>x.id!==id);
      state.batches=state.batches.filter(x=>x.materialId!==id);
      state.losses=state.losses.filter(x=>x.materialId!==id);
      state.snoozes=state.snoozes.filter(s=>!batchIds.has(s.batchId));
      if(!persist())return;
      closeSheet();render(true);
      showToast(`已删除「${m.name}」`,true);
      break;
    }
    case 'save-cat':{
      const newName=gv('c_name').trim();if(!newName){alert('不能为空');return;}
      const idxStr=el.dataset.id??'',isNew=idxStr==='';
      if(isNew){if(state.categories.includes(newName)){alert('分类已存在');return;}state.categories.push(newName);}
      else{
        const idx=Number(idxStr),oldName=state.categories[idx];
        if(oldName===undefined){showToast('分类已不存在');closeSheet();break;}
        if(newName!==oldName){
          if(state.categories.includes(newName)){alert('分类已存在');return;}
          state.categories[idx]=newName;
          state.materials.forEach(m=>{m.categories=m.categories.map(c=>c===oldName?newName:c);});
          if(stockView==='cat:'+oldName)stockView='cat:'+newName;
        }
      }
      if(!saveAndClose())return;
      showToast('分类已保存',true);
      break;
    }
    case 'del-cat':{
      const idx=Number(el.dataset.idx),oldName=state.categories[idx];
      if(oldName===undefined){showToast('分类已不存在');closeSheet();break;}
      if(state.materials.some(m=>m.categories.includes(oldName))){alert(`无法删除：还有物料属于「${oldName}」`);return;}
      if(!confirm(`确认删除分类「${oldName}」？`))return;
      state.categories.splice(idx,1);if(stockView==='cat:'+oldName)stockView='';
      if(!saveAndClose())return;
      showToast('分类已删除',true);
      break;
    }
    case 'save-rule':{
      const name=gv('r_name').trim(),type=gv('r_type'),value=clamp(gv('r_val'),0,999,0);
      if(!name){alert('请填写规则名');return;}
      if(id){const r=getRule(id);if(r)Object.assign(r,{name,type,value});}else state.rules.push({id:uid('r'),name,type,value});
      if(!saveAndClose())return;
      showToast('规则已保存',true);
      break;
    }
    case 'del-rule':{
      const r=getRule(id);if(!r)return;
      const used=state.materials.filter(m=>m.ruleId===id);
      if(used.length){alert(`无法删除：${used.length} 个物料正在使用该规则（如「${used[0].name}」）。`);return;}
      if(!confirm(`确认删除规则「${r.name}」？`))return;
      state.rules=state.rules.filter(x=>x.id!==id);
      if(!saveAndClose())return;
      showToast('规则已删除',true);
      break;
    }
    case 'save-settings':{
      state.settings.soonDays=Math.round(clamp(gv('setSoon'),1,30,DEFAULT_SETTINGS.soonDays));
      state.settings.lowStock=clamp(gv('setLow'),0,1000,DEFAULT_SETTINGS.lowStock);
      if(!saveAndClose())return;
      showToast('已保存',true);
      break;
    }
    case 'export-json':exportJSON();break;
    case 'export-stock-csv':exportStockCSV();break;
    case 'export-csv':exportLossCSV();break;
    case 'copy-shoplist':copyShopList();break;
    case 'trigger-import':currentActionLabel='导入数据';$('importFile').click();break;
    case 'cal-prev':calOffset--;render(true);break;
    case 'cal-next':calOffset++;render(true);break;
    case 'cal-day':calDaySheet(el.dataset.date);break;
    case 'clean-old-data':{
      if(!confirm('清理历史数据？'))return;
      addSnapshot('清理前');
      const t=today();let rb=0,rl=0;const removed=new Set();
      state.batches=state.batches.filter(b=>{if(b.status!=='used'&&b.status!=='lost')return true;const end=parseDateStr(b.lossDate||b.usedDate||b.openDate||b.createDate);if(!end)return true;if(diffDays(end,t)>180){rb++;removed.add(b.id);return false;}return true;});
      state.losses=state.losses.filter(l=>{const d=parseDateStr(l.date);if(!d)return true;if(diffDays(d,t)>365){rl++;return false;}return true;});
      state.snoozes=state.snoozes.filter(s=>!removed.has(s.batchId));
      if(!persist())return;
      render(true);
      showToast(`清理完成：批次 ${rb} 条，记录 ${rl} 条`,true);
      break;
    }
    case 'reset-all':resetConfirmSheet();break;
    case 'do-reset-all':{
      if(gv('resetConfirm').trim()!=='清空全部'){alert('请输入「清空全部」后再确认');return;}
      addSnapshot('清空前');
      const backup=state;state=defaultState();
      if(!persist()){state=backup;return;}
      currentTab='home';
      resetUI();render(false);
      showToast('已清空全部数据',true);
      break;
    }
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='stockSearch'){stockQuery=e.target.value;applyStockFilter();}
  else if(e.target.id==='logSearch'){logQuery=e.target.value;applyLogFilter();}
});
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.shiftKey||e.key.toLowerCase()!=='z')return;
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  if($('mask').classList.contains('show'))return;
  e.preventDefault();undoLast();
});
let lpTimer=null,lpFired=false,lpStart=null,lpBlockUntil=0;
const cancelLongPress=()=>{clearTimeout(lpTimer);lpStart=null;};
const endLongPress=()=>{if(lpFired)lpBlockUntil=Date.now()+300;cancelLongPress();};
document.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const card=e.target.closest('.scard');if(!card)return;
  if(e.target.closest('.pin-btn'))return;
  lpStart={x:e.clientX,y:e.clientY};
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{
    lpFired=true;lpBlockUntil=Date.now()+350;
    cardMenuSheet(card.dataset.id);
    vib(15);
    setTimeout(()=>{lpFired=false;},700);
  },500);
});
document.addEventListener('pointermove',e=>{
  if(!lpStart)return;
  if(Math.abs(e.clientX-lpStart.x)>10||Math.abs(e.clientY-lpStart.y)>10)cancelLongPress();
});
document.addEventListener('pointerup',endLongPress);
document.addEventListener('pointercancel',endLongPress);
document.addEventListener('click',e=>{
  if(lpFired||Date.now()<lpBlockUntil){
    if(Date.now()<lpBlockUntil){e.preventDefault();e.stopPropagation();}
    lpFired=false;
  }
},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.scard'))e.preventDefault();});

/* ===== 初始化与跨天刷新 ===== */
(function init(){
  if(!loadOK){
    try{
      const raw=localStorage.getItem(DB_KEY);
      if(raw)localStorage.setItem(DB_KEY+'_bad_'+Date.now(),raw);
    }catch(e){}
    state=defaultState();
    try{localStorage.setItem(DB_KEY,JSON.stringify(state));}catch(e){}
  }
  loadSnapshots();
  try{currentTheme=localStorage.getItem(THEME_KEY)==='blue'?'blue':'paper';}catch(e){currentTheme='paper';}
  applyTheme(currentTheme,false);
  ensureDailySnapshot();
  lastSavedState=JSON.stringify(state);
  undoReady=true;
  render(false);
  
  let currentDayStr = todayStr();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return;
    if($('mask').classList.contains('show'))return;
    
    if(todayStr() !== currentDayStr){
      currentDayStr = todayStr();
      ensureDailySnapshot();
      render(false);
      showToast('已自动刷新日期');
      return;
    }
    
    const ae=document.activeElement;
    if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))return;
    render(true);
  });
})();
</script>
<script>
/* ===== 运行环境增强：离线缓存 / 可安装 / 存储持久化 ===== */
(function(){
  var secure=window.isSecureContext;
  if(secure&&'serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  var lock=function(){
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}catch(e){}
  };
  document.addEventListener('click',lock,{once:true,passive:true});
  document.addEventListener('touchstart',lock,{once:true,passive:true});
})();
</script>
